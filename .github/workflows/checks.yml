name: Testy materiałów

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Przykłady w Pythonie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install numpy scipy matplotlib
      - name: Uruchomienie bloków kodu z plików .md
        run: python tools/check_snippets.py .
      - name: Odnośniki lokalne i numery stron PDF
        run: python tools/check_links.py . --tylko-lokalne
